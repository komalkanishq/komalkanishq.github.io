<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cormorant+SC:wght@600&family=Great+Vibes&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 30%, #fffbf3, #f5eedf 70%); color: #5b4636; font-family: "Cormorant Garamond", serif; text-align: center; position: relative; }
  .drape { position: absolute; top: 0; left: 0; width: 230px; z-index: 2; }
  .drape.r { left: auto; right: 0; transform: scaleX(-1); }
  .garden { position: absolute; left: 0; right: 0; bottom: 0; height: 630px; background: url(../assets/garden.jpg) 50% 18% / cover;
            -webkit-mask-image: linear-gradient(to bottom, transparent, #000 30%); }
  .content { position: relative; z-index: 1; padding: 30px 170px 0; height: 790px; box-sizing: border-box;
             display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .content > * { flex: none; }
  .heart { width: 28px; color: #c9a66b; }
  .kicker { font-size: 29px; margin: 0; }
  .name { font-family: "Great Vibes", cursive; font-size: 104px; line-height: 1.05; margin: 4px 0 0; }
  .who { font-size: 27px; margin: 0; }
  .amp { font-family: "Great Vibes", cursive; font-size: 58px; line-height: 1; color: #c9a66b; margin: 6px 0 -8px; }
  .hr { display: flex; align-items: center; gap: 14px; width: 260px; margin: 20px auto 14px; color: #c9a66b; }
  .hr::before, .hr::after { content: ""; flex: 1; height: 1.5px; background: currentColor; }
  .hr svg { width: 16px; }
  .when { font: 600 30px "Cormorant SC", serif; letter-spacing: .1em; color: #2f3b2a; }
  .venue { font-size: 26px; margin-top: 4px; }
  .venue.follow { font-style: italic; font-size: 25px; color: #7a6656; margin-top: 10px; }
  .foot.solo { padding: 16px 40px; text-align: center; }
  .foot.solo .t3 { font-size: 26px; margin-top: 2px; }
  .events { display: flex; justify-content: center; gap: 18px; margin: 16px -90px 0; }
  .ev { flex: 1; background: rgba(251,247,238,.85); border: 1.5px solid rgba(201,166,107,.5); border-radius: 16px; padding: 6px 10px 10px; }
  .ev h3 { font-family: "Pinyon Script", cursive; font-weight: 400; font-size: 32px; line-height: 1.2; color: #5c6640; margin: 0; }
  .ev p { margin: 0; font-size: 21px; line-height: 1.3; }
  .ev .w { font: 600 18px "Cormorant SC", serif; letter-spacing: .08em; }
  .foot { position: absolute; z-index: 2; left: 50%; bottom: 40px; transform: translateX(-50%); display: flex; align-items: center; gap: 22px;
          background: rgba(251,247,238,.93); border: 1.5px solid rgba(201,166,107,.6); border-radius: 20px; padding: 14px 26px 14px 14px; text-align: left;
          box-shadow: 0 10px 26px rgba(40,30,20,.25); white-space: nowrap; }
  .qr { background: #fff; padding: 8px; border-radius: 10px; }
  .qr img { display: block; width: 200px; height: 200px; image-rendering: pixelated; }
  .t1 { font: 600 23px "Cormorant SC", serif; letter-spacing: .1em; color: #2f3b2a; }
  .t2 { font-size: 20px; margin-top: 2px; color: #7a6656; }
  .t3 { font-size: 21px; margin-top: 6px; }
</style></head>
<body>
  <div class="garden"></div>
  <img class="drape" src="../assets/drape.webp" alt="">
  <img class="drape r" src="../assets/drape.webp" alt="">
  <div class="content">
    <svg class="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20.5s-7.5-4.6-7.5-10.4A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.5 2.7c0 5.8-7.5 10.4-7.5 10.4z"/></svg>
    <p class="kicker">We’re getting married</p>
    <p class="name">{{BRIDE}}</p>
    <p class="who">{{BRIDE_PARENTS}}</p>
    <p class="amp">&amp;</p>
    <p class="name">{{GROOM}}</p>
    <p class="who">{{GROOM_PARENTS}}</p>
    <div class="hr"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-7.5-4.6-7.5-10.4A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.5 2.7c0 5.8-7.5 10.4-7.5 10.4z"/></svg></div>
    <div class="when">{{MAIN_WHEN}}</div>
    {{VENUE_BLOCK}}
    {{EVENTS}}
  </div>
  {{FOOT}}
</body></html>
